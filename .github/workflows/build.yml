name: Build Gedrouble

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-android64:
    name: Build Android arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Geode SDK from mod.json
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          use-lto: false

      - name: Upload Gedrouble package
        uses: actions/upload-artifact@v4
        with:
          name: gedrouble-android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
